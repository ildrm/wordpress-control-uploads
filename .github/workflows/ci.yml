name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, dom, sodium, fileinfo, mbstring, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
      - run: vendor/bin/phpcs --standard=.phpcs.xml
      - run: vendor/bin/phpstan analyse --memory-limit=2G
      - run: composer audit --locked
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npm audit
      - run: python3 tools/openapi.py --check
      - run: python3 tools/verify-docs.py
      - run: python3 tools/verify-release.py
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress: ['6.8.3', '6.9.4', '7.0.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
      - run: npm ci && npm run build
      - run: docker compose -p cf-test -f compose.test.yml up -d db wordpress
      - run: docker compose -p cf-test -f compose.test.yml exec wordpress sh -c 'chown www-data:www-data /var/cf-private && chmod 700 /var/cf-private'
      - run: docker compose -p cf-test -f compose.test.yml run --rm cli wp core update --version=${{ matrix.wordpress }} --force
      - run: docker compose -p cf-test -f compose.test.yml run --rm cli wp core install --url=http://localhost:8887 --title='Firewall Test' --admin_user=admin --admin_password=cf-local-test-password --admin_email=admin@example.test --skip-email
      - run: docker compose -p cf-test -f compose.test.yml run --rm cli wp core update-db
      - run: docker compose -p cf-test -f compose.test.yml run --rm cli wp plugin activate content-firewall
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/structure.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/run.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/review.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/hardening.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/privacy.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/workflows.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/publication-gate.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/migrations.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/simulation.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/headless.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/leases.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/audit-key.php
      - run: docker compose -p cf-test -f compose.test.yml exec wordpress sh -c 'apt-get update && apt-get install -y --no-install-recommends ffmpeg poppler-utils'
      - run: docker compose -p cf-test -f compose.test.yml exec -e CF_FFMPEG_BIN=/usr/bin/ffmpeg -e CF_FFPROBE_BIN=/usr/bin/ffprobe -e CF_PDFINFO_BIN=/usr/bin/pdfinfo -e CF_PDFTOPPM_BIN=/usr/bin/pdftoppm -e CF_PDFTOTEXT_BIN=/usr/bin/pdftotext -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/media-tools.php
      - run: docker compose -p cf-test -f compose.test.yml exec -e CF_FFMPEG_BIN=/usr/bin/ffmpeg -e CF_FFPROBE_BIN=/usr/bin/ffprobe -e CF_PDFINFO_BIN=/usr/bin/pdfinfo -e CF_PDFTOPPM_BIN=/usr/bin/pdftoppm -e CF_PDFTOTEXT_BIN=/usr/bin/pdftotext -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/processing.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/publication-crash.php
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/concurrency.php
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose -p cf-test -f compose.test.yml run --rm cli wp core multisite-convert --title='Firewall Network' --base=/
      - run: docker compose -p cf-test -f compose.test.yml exec -u www-data wordpress php /var/www/html/wp-content/plugins/content-firewall/tests/Integration/multisite.php
      - run: npx playwright test --grep 'Headless upload|canonical entry'
      - if: always()
        run: docker compose -p cf-test -f compose.test.yml down
